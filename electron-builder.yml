appId: com.justin06lee.cid
productName: cid
copyright: cid

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

# Copied verbatim rather than bundled: macOS resolves the menubar icon's @2x
# variant by filename, so the pair has to keep its names and sit together.
extraResources:
  - from: resources
    to: resources

mac:
  category: public.app-category.entertainment
  icon: build/icon.png
  darkModeSupport: true
  # `dir` only: this is a personal tool installed by `make`, and building a dmg
  # for an app you copy to /Applications yourself is a minute of nothing.
  target:
    - dir
